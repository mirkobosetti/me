<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0a0a0b"/>
  <!-- terminal frame -->
  <rect x="40" y="40" width="1120" height="550" rx="10" fill="#101012" stroke="#2a2a2e" stroke-width="2"/>
  <!-- window chrome -->
  <circle cx="78" cy="78" r="8" fill="#3a3a3e"/>
  <circle cx="106" cy="78" r="8" fill="#3a3a3e"/>
  <circle cx="134" cy="78" r="8" fill="#3a3a3e"/>
  <text x="600" y="86" text-anchor="middle" font-family="Menlo, Monaco, 'Courier New', monospace" font-size="22" fill="#6b6b70">mirko@portfolio — ~</text>
  <line x1="40" y1="112" x2="1160" y2="112" stroke="#2a2a2e" stroke-width="2"/>

  <!-- prompt -->
  <text x="100" y="205" font-family="Menlo, Monaco, 'Courier New', monospace" font-size="28" fill="#6b6b70">~ $ whoami</text>

  <!-- name -->
  <text x="96" y="300" font-family="Menlo, Monaco, 'Courier New', monospace" font-weight="bold" font-size="82" fill="#f5f5f5">MIRKO</text>
  <text x="96" y="390" font-family="Menlo, Monaco, 'Courier New', monospace" font-weight="bold" font-size="82" fill="#ffc233">BOSETTI<tspan fill="#f5f5f5">.</tspan></text>

  <!-- role -->
  <text x="100" y="460" font-family="Menlo, Monaco, 'Courier New', monospace" font-size="34" fill="#ffc233">Full Stack Web Developer</text>
  <text x="100" y="510" font-family="Menlo, Monaco, 'Courier New', monospace" font-size="26" fill="#8a8a8f">Vue · Nuxt · React · .NET — Trento, Italy</text>

  <!-- url -->
  <text x="100" y="560" font-family="Menlo, Monaco, 'Courier New', monospace" font-size="24" fill="#6b6b70">https://mirkobosetti.com <tspan fill="#ffc233">▮</tspan></text>

  <!-- big pixel M, bottom-right -->
  <g fill="#ffc233" transform="translate(760, 210) scale(13)" opacity="0.92">
    <rect x="6" y="8" width="4" height="4"/>
    <rect x="6" y="12" width="4" height="4"/>
    <rect x="6" y="16" width="4" height="4"/>
    <rect x="6" y="20" width="4" height="4"/>
    <rect x="10" y="12" width="4" height="4"/>
    <rect x="14" y="16" width="4" height="4"/>
    <rect x="18" y="12" width="4" height="4"/>
    <rect x="22" y="8" width="4" height="4"/>
    <rect x="22" y="12" width="4" height="4"/>
    <rect x="22" y="16" width="4" height="4"/>
    <rect x="22" y="20" width="4" height="4"/>
  </g>
</svg>
